# docker-compose.yml

services:
  cobol-api:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # Le programme COBOL est désormais compilé dans l'image : seule la base
      # de données a besoin de survivre au conteneur.
      - ./database:/app/database
    environment:
      - NODE_ENV=production
    restart: unless-stopped
