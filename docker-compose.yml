# docker-compose.yml

services:
  cobol-api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - APP_ENV=production
      # Le moteur calcule des echeanciers de credit : sans API_KEY, le
      # serveur refuse de demarrer en production. Voir .env.example.
      - API_KEY=${API_KEY:-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    restart: unless-stopped
