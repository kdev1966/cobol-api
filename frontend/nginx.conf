server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # L'application est une page unique : toute route inconnue doit rendre
    # index.html, faute de quoi /dossiers/12 donnerait un 404 au rafraichissement.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers produits par Vite portent une empreinte dans leur nom : ils
    # ne changent jamais a nom egal, et se mettent donc en cache sans reserve.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne porte pas d'empreinte : le mettre en cache figerait
    # l'application sur une version ancienne.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # L'application ne charge que ses propres ressources, et n'appelle que
    # l'API. connect-src reste large : l'origine de l'API varie selon le
    # deploiement, et elle est figee au build du bundle, non ici.
    add_header Content-Security-Policy
        "default-src 'self'; connect-src *; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}
